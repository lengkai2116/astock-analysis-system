# dim_engine.yaml — 维度引擎阈值配置（431号 F2/485-7 收敛）
#
# 背景：dimensions/ 各引擎（dim2-dim8）判定阈值原为代码内硬编码（431 F2 取证：
# 维度引擎零配置引用）。本文件提供 yaml 落点，代码改读本配置（值逐字节不变，
# 零行为变更）；缺失时回退代码默认值（与现状一致，431 F1「配置可选+兜底」口径）。
#
# ⚠️ 取值属「果」侧判定（445 冻结 + 439-A 同批）：调整任何值须独立号 +
#    知识库依据 + 全链路验证（485-5/485-6 待拍板项，勿顺手改）。
#    外部已 SSOT 的阈值族（light_derive 灯色 / emotion_temperature 温度 /
#    potential_engine 潜力权重 / valuation_estimator 估值锚 / phase_detector
#    主力阶段 / framework 缠论）不在此重复，维度引擎只消费其产物。
#
# 版本：v1（2026-10-11，批次1：dim6 接线）

# dim6 风险边界引擎（dim6_risk_engine.py）
# 来源值 = 代码现状（452 流动性 KB 双门槛 / 448 PIERS-E / 461-4 波动率档位对齐 framework）
dim6:
  event_risk_set: [fraud_sign, regulatory, delist_risk, goodwill_risk, st_warning]
  st_warning_extreme_dir: -2           # *ST / 退市整理（direction<=-2 升「极高」）
  liquidity_min_avg_amount_wan: 5000.0   # 日均成交额门槛 5000 万元（KB 双门槛）
  liquidity_min_circ_mv_wan: 300000.0    # 流通市值门槛 30 亿元（单位：万元）
  piers_e_dta_threshold: 70            # PIERS-E 资产负债率 >70% 触发
  piers_e_roce_threshold: 15           # PIERS-E ROCE <15% 触发
  rr_worthless: 1.0                    # 盈亏比 <1R 不值得交易
  rr_consider: 2.0                     # 盈亏比 1R-2R 可考虑
  rr_good: 3.0                         # 盈亏比 2R-3R 较好
  vol20_high: 4.0                      # 20 日未年化波动率 >4% 高（461-4 对齐 framework）
  vol20_medium: 2.0                    # 20 日未年化波动率 >2% 中
  risk_level_high_count: 2             # 高风险源计数 >=2 → 等级高
  risk_level_medium_count: 1           # 高风险源计数 ==1 → 等级中
  # PIERS 硬否决事件集不在此重复——直接读 status_engine.yaml l0.event_hard_risks
  # （[fraud_sign, delist_risk]，448 号，JUD/SIG 同源统一）

# shared_vol_ratio（shared_vol_ratio.py 量比分级，364h 收敛）
shared_vol_ratio:
  extreme_expand: 3.0        # 量比 >=3.0 极度放量
  significant_expand: 2.0    # 量比 >=2.0 显著放量
  moderate_expand: 1.2       # 量比 >=1.2 温和放量
  normal_min: 0.8            # 量比 >=0.8 正常
  shrink_min: 0.5            # 量比 >=0.5 缩量（<0.5 极度缩量）

# dim2 走势结构引擎（dim2_structure_engine.py）
dim2:
  confirmed_threshold: 0.6       # 买卖点 confidence >= 即 confirmed（audit「有确认买点」+ conflict_matrix）
  chanlun_phase_threshold: 0.6   # 11 定理 overall_score >= 即「健康」（chanlun_phase）
  health_score_threshold: 60     # 结构健康度 audit >=60 即健康（466 号：与前端 structure_health_score 同源）

# dim5 情绪引擎（dim5_emotion_engine.py；温度 7 入参权重/基温在 emotion_temperature.py SSOT，不在此重复）
dim5:
  fast_vol_mult: 1.5             # 快线放量判据：当日量 > 5日均量 ×1.5
  fast_mom_threshold: 3.0        # 快线动量判据：5 日涨幅 >3%
  fast_amplitude_threshold: 3.0  # 快线振幅判据：日振幅 >3%
  fast_bear_mom: -3.0            # 快线看空判据：5 日动量 < -3%
  fast_pass_buy: 3               # pass_count >=3 → BUY
  fast_pass_watch: 2             # pass_count >=2 → WATCH
  fast_conf_buy: 0.65            # BUY 基础置信
  fast_conf_watch: 0.50          # WATCH 基础置信
  fast_conf_bearish: 0.35        # BEARISH/NEUTRAL 基础置信
  fast_conf_adj: 0.05            # 快线条件叠加调整（±0.05）
  erp_bullish_strong: 5.0        # ERP >5% 强看多
  erp_bullish_weak: 3.0          # ERP >3% 弱看多
  erp_bearish_extreme: 0.5       # ERP <0.5% 强看空
  erp_bearish_weak: 1.5          # ERP <1.5% 弱看空
  erp_conf_strong: 0.75          # 强信号置信
  erp_conf_weak: 0.60            # 弱信号置信
  erp_final_cap: 0.8             # 慢线最终置信度上限
  erp_conf_mult: 1.1             # 慢线置信度放大系数
  quadrant_qconf_threshold: 0.5  # 四象限 WATCH 判高置信门槛
  quadrant_mult_ll: 1.15         # LL 情绪底部权重乘数
  quadrant_mult_lh: 1.05         # LH 底部反弹
  quadrant_mult_hl: 0.90         # HL 高位震荡
  quadrant_mult_hh: 0.75         # HH 上涨尾声
  quadrant_mult_mm: 1.00         # MM 中性
  bociasi_fast_weight: 0.6       # 温度 BOCIASI 修正快线权重
  bociasi_slow_weight: 0.4       # 温度 BOCIASI 修正慢线权重
  temp_merge_temperature: 0.4    # 温度合成：原温度权重
  temp_merge_bociasi: 0.6        # 温度合成：BOCIASI 权重
