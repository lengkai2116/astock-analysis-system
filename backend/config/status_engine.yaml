# status_engine.yaml — 现状判定引擎 L2 聚合配置（336号 §7）
# 版本化可回滚：修改后 version+1，旧版可回滚（334号阈值管理机制）
version: 2

# 390号方案：多因子决策引擎版本切换（P5.4回滚机制）
# v390 = 新管线（convert_to_factors→reliability→consensus→conflict_matrix→factor_arbiter）
# legacy = 旧管线（convert_to_dims_format→conflict_detector→arbiter）
jud_engine_version: "v390"

consensus:
  enter_threshold: 0.67        # 可入场门槛（知识库 ≥2/3，336号 C1）
  bearish_strong: 0.67         # 强看空 → avoid（对称 2/3）

conflict_rules:                # conflict_evidence 规则登记（336号 §4；由 arbiter.arbitrate 按名消费）
  enabled: true
  rules:
    - trend_vs_multi            # 缠论方向 vs 多周期趋势
    - high_profit_no_flow       # 高位获利盘
    - distributing_vs_confirm   # 主力出货 vs 右侧确认
    - risk_high_vs_confirm      # 结构风险 HIGH vs 右侧确认
    - high_profit_no_presence   # 高位无主力在场（336号扩展）
    - deep_valuation_confirm    # 深度高估 + 强确认（335号 deep 改强提示）

l0:
  hard_risks: [regulatory]               # L0a 硬否决（335号）：catalyst_event 命中即否决
  soft_risk_coeff:                       # L0b 仓位系数（对齐 cross_validate._evaluate_gate）
    fina_weak: 0.5
    fina_fail: 0.5
    distributing: 0.7
    low_liquidity: 0.7
    valuation_moderate: 0.5
    valuation_mild: 0.8
    deep_position_cap: 0.3               # deep 强提示 + 仓位压缩（335号 §3）
  emotion_position_cap:                  # 387号§5.4：情绪周期-仓位联动参数（消费方 advice_engine）
    ice: 0.10                            # 冰点期：总仓位上限10%
    ebb: 0.30                            # 退潮期：总仓位上限30%
    normal: 0.60                         # 正常期：总仓位上限60%
    recovery: 0.60                       # 复苏期：总仓位上限60%
    positive: 0.80                       # 积极期：总仓位上限80%
  hold_only_stages:                      # 387号§5.1：持有期阶段（信号已延伸→不新开仓）
    - "已延伸"
