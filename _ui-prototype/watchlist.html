var API_BASE = 'http://localhost:5001/api/v3';
async function _apiFetch(path, opts){
  opts = opts || {};
  var url = API_BASE + path;
  if(opts.params){
    var qs = Object.keys(opts.params).filter(function(k){return opts.params[k]!==undefined&&opts.params[k]!==null&&opts.params[k]!=='';}).map(function(k){return encodeURIComponent(k)+'='+encodeURIComponent(opts.params[k]);}).join('&');
    if(qs) url += '?' + qs;
  }
  var fetchOpts = {method:opts.method||'GET'};
  if(opts.body){fetchOpts.body=JSON.stringify(opts.body);fetchOpts.headers={'Content-Type':'application/json'};}
  var r=await fetch(url, fetchOpts);
  if(!r.ok){var e=await r.json().catch(function(){return{error:r.statusText};});throw new Error(e.error||e.message||'请求失败');}
  return r.json();
}

var _evaluatedState = {};  // ts_code → {evaluated, scores}

// ════════════════════════════════════════════
// 状态
// ════════════════════════════════════════════
var activeColumns = (function(){
  var saved = localStorage.getItem('watchlist_columns');
  var def = ['check','code','name','price','change_pct','volume','composite','chanlun','vp','factor','fund_net','signal_tag'];
  if(saved){ try{ var p=JSON.parse(saved); return Array.isArray(p)&&p.length?p:def; }catch(e){} }
  // 首次使用，持久化默认配置
  localStorage.setItem('watchlist_columns', JSON.stringify(def));
  return def;
})();

function saveActiveColumns(){
  localStorage.setItem('watchlist_columns', JSON.stringify(activeColumns));
}
var dragCol = null;
var dragIdx = -1;

// ════════════════════════════════════════════
// API初始化 — 批量行情加载
// ════════════════════════════════════════════
async function loadWatchlistData(){
  try{
    // 获取自选列表（含DB id，用于删除）
    var listResp = await _apiFetch('/watchlist');
    if(listResp && listResp.success && listResp.data){
      listResp.data.forEach(function(item){ _watchlistIdByCode[item.ts_code] = item.id; });
    }
  }catch(e){ console.warn('加载自选列表失败', e); }
  try{
    var resp = await _apiFetch('/watchlist/quotes');
    if(resp && resp.code === 0 && resp.data && resp.data.stocks){
      var stocks = resp.data.stocks;
      var evaluated = resp.data.evaluated || {};
      stockData = Object.keys(stocks).map(function(code){
        var s = stocks[code];
        _evaluatedState[code] = {evaluated: evaluated[code]||false};
        return mapApiStock(s);
      });
    }
  }catch(e){
    console.warn('加载自选行情失败', e);
    stockData = [];
  }
  // 从 sessionStorage 恢复评估结果（切页面回来不丢失）
  stockData.forEach(function(s){
    var cached = _loadEvalFromCache(s.code);
    if(cached) _applyEvalToStock(s, cached);
  });
  renderTable();
}

function mapApiStock(s){
  // Map API fields to display-ready format
  return {
    code: s.ts_code||'',
    name: s.name||'',
    price: s.price!==null?s.price.toFixed(2):'—',
    change: s.change_pct!==null?(s.change_pct>=0?'+'+s.change_pct.toFixed(2)+'%':s.change_pct.toFixed(2)+'%'):'—',

// ── 格式化辅助 ──
function fmtNum(v){
  if(v===null||v===undefined) return '—';
  if(v>=100000000) return (v/100000000).toFixed(2)+'亿';
  if(v>=10000) return (v/10000).toFixed(0)+'万';
  return v.toString();
}
function fmtMoney(v){
  if(v===null||v===undefined) return '—';
  if(v>=100000000) return (v/100000000).toFixed(2)+'亿';
  if(v>=10000) return (v/10000).toFixed(0)+'万';
  return '¥'+v;
}
function fmtBigMoney(v){
  if(v===null||v===undefined) return '—';
  if(v>=100000000) return (v/100000000).toFixed(1)+'亿';
  if(v>=10000) return (v/10000).toFixed(0)+'万';
  return v.toString();
}
function fmtShares(v){
  if(v===null||v===undefined) return '—';
  if(v>=100000000) return (v/100000000).toFixed(2)+'亿';
  if(v>=10000) return (v/10000).toFixed(0)+'万';
  return v.toString();
}
function fmtFundNet(v){
  if(v===null||v===undefined) return '—';
  var dir = v>=0?'↑':'↓';
  var a = Math.abs(v);
  if(a>=100000000) return dir+' '+(a/100000000).toFixed(1)+'亿';
  if(a>=10000) return dir+' '+(a/10000).toFixed(1)+'万';
  return dir+' '+a.toFixed(1);
}
function fmtSignalTags(tags){
  if(!tags||!tags.length) return '⏳ 待评估';
  var tag = tags[0];
  if(tag==='strong_buy') return '🔥 强烈推荐';
  if(tag==='buy') return '✅ 推荐';
  if(tag==='watch') return '👀 关注';
  if(tag==='neutral') return '⚪ 中性';
  return tag;
}

function renderTable(){
  var orderedCols = activeColumns.map(function(k){ return ALL_COLUMNS.find(function(c){ return c.key === k; }); }).filter(Boolean);
  var thead = document.getElementById('table-header');
  var tbody = document.getElementById('table-body');

  var hhtml = '<tr id="header-row">';
  orderedCols.forEach(function(col, i){
    var style = col.width ? 'style="width:'+col.width+'px;"' : '';
    var cls = col.fixed ? 'locked' : 'draggable';
    var draggable = col.fixed ? '' : 'draggable="true"';
    hhtml += '<th class="'+cls+'" '+style+' '+draggable
          + ' data-col="'+col.key+'" data-idx="'+i+'"'
          + ' ondragstart="onDragStart(event,\''+col.key+'\')"'
          + ' ondragover="onDragOver(event,\''+col.key+'\')"'
          + ' ondragend="onDragEnd(event)"'
          + ' ondrop="onDrop(event,\''+col.key+'\')"'
          + '>'+(col.label||'')
          + (col.fixed ? '' : '<span class="drag-hint">⣿</span>')
          + '</th>';
  });
  hhtml += '</tr>';
  thead.innerHTML = hhtml;

  var bhtml = '';
  stockData.forEach(function(s){
    bhtml += '<tr class="watchlist-click" onclick="location.href=\'indicator-ide.html?code='+s.code+'\'" data-search="'+s.name+' '+s.code+'" data-rating="'+getRatingKey(s)+'">';
    orderedCols.forEach(function(col){
      bhtml += renderCell(col, s);
    });
    bhtml += '</tr>';
  });
  tbody.innerHTML = bhtml;
  updateCount();
}

function renderCell(col, s){
var k = col.key;
  if(k === 'check') return '<td onclick="event.stopPropagation()"><input type="checkbox" style="accent-color:#3B82F6;cursor:pointer;" onchange="toggleSelect(\''+s.code+'\',this.checked)"></td>';
  if(k === 'code') return '<td>'+s.code+'</td>';
  if(k === 'name') return '<td>'+s.name+'</td>';
  if(k === 'price') return '<td style="font-weight:600;">'+(s.price!=='—'?'¥'+s.price:'—')+'</td>';
  if(k === 'change_pct') return '<td class="'+(s.change.indexOf('+')>=0?'up':(s.change.indexOf('-')>=0?'down':''))+'">'+s.change+'</td>';

  // 数值行情通用
  var numFields = {chg_speed:1,volume:1,amount:1,turnover:1,vol_ratio:1,amplitude:1,high:1,low:1,open:1,pre_close:1,avg_price:1,buy1:1,sell1:1,cur_vol:1,in_disk:1,out_disk:1,commission:1,chg_5d:1,chg_10d:1,industry:1};
  if(numFields[k]) return '<td style="font-size:11px;">'+(s[k]||'—')+'</td>';

  // 策略评分 — 未评估显示按钮
  var scoreFields = {composite:'综合评分',chanlun:'缠论评分',vp:'量价评分',factor:'因子评分'};
  if(scoreFields[k]){
    var v = s[k];
    if(v === null || v === undefined){
      if(k === 'composite') return '<td><button class="eval-btn" onclick="event.stopPropagation();evaluateStock(\''+s.code+'\',this)">⚡ 策略评估</button></td>';
      return '<td style="color:var(--text-muted);font-size:11px;">—</td>';
    }
    var tc = v>=80?'tag-bullish':(v>=60?'tag-watch':'tag-neutral');
    return '<td><span class="tag '+tc+'" style="font-size:11px;">'+v+'</span></td>';
  }

  // 信号标签/买入/卖出/技术形态
  if(k === 'signal_tag'){
    var smap = {'🔥':'tag-bullish','✅':'tag-bullish','👀':'tag-watch','⚪':'tag-neutral','⏳':'tag-watch'};
    var sc = 'tag-neutral';
    for(var sp in smap){ if((s.signal_tag||'').indexOf(sp)>=0){ sc = smap[sp]; break; } }
    return '<td><span class="tag '+sc+'" style="font-size:11px;">'+(s.signal_tag||'⏳ 待评估')+'</span></td>';
  }
  if(k === 'buy_signal') return '<td style="color:#EF4444;font-size:11px;">'+(s.buy_signal||'—')+'</td>';
  if(k === 'sell_signal') return '<td style="color:#22C55E;font-size:11px;">'+(s.sell_signal||'—')+'</td>';
  if(k === 'tech_pattern') return '<td style="font-size:11px;color:var(--text-secondary);">'+(s.tech_pattern||'—')+'</td>';
  if(k === 'ai_strategy') return '<td style="font-size:11px;color:var(--text-secondary);">'+(s.ai_strategy||'—')+'</td>';

  // 资金流向
  if(k === 'fund_net') return '<td class="'+(s.fund_net.indexOf('↑')>=0?'money-in':'money-out')+'">'+(s.fund_net||'—')+'</td>';
  var fundFields = {fund_vol:1,fund_inflow:1,fund_outflow:1,big_net:1,big_in:1,big_out:1,mid_net:1,sml_net:1,big_5d:1,big_10d:1,fund_add_td:1,fund_add_2d:1,fund_add_5d:1};
  if(fundFields[k]) return '<td style="font-size:11px;">'+(s[k]||'—')+'</td>';

  // 基础面
  var basicFields = {pe_ttm:1,pe_static:1,pb:1,roe_ttm:1,np_growth:1,gross_margin:1,debt_ratio:1,eps:1,bps:1,mkt_cap_circ:1,mkt_cap_total:1,shares_total:1,shares_circ:1,shareholder_n:1,major_holder:1,list_date:1,industry_full:1,peg:1,main_force_pwd:1,main_force_intent:1};
  if(basicFields[k]) return '<td style="font-size:11px;">'+(s[k]||'—')+'</td>';

  return '<td></td>';
}

// 拖拽排序
// ════════════════════════════════════════════
function onDragStart(e, key){
  var col = ALL_COLUMNS.find(function(c){ return c.key === key; });
  if(col && col.fixed){ e.preventDefault(); return false; }
  dragCol = key;
  e.dataTransfer.effectAllowed = 'move';
  e.dataTransfer.setData('text/plain', key);
  e.target.style.opacity = '0.5';
}
function onDragOver(e, key){
  e.preventDefault();
  e.dataTransfer.dropEffect = 'move';
  document.querySelectorAll('#header-row th').forEach(function(th){ th.classList.remove('drag-over'); });
  var tgt = ALL_COLUMNS.find(function(c){ return c.key === key; });
  if(tgt && tgt.fixed) return;
  if(key === dragCol) return;
  e.currentTarget.classList.add('drag-over');
}
function onDragEnd(e){
  document.querySelectorAll('#header-row th').forEach(function(th){ th.classList.remove('drag-over'); th.style.opacity = ''; });
}
function onDrop(e, targetKey){
  e.preventDefault();
  document.querySelectorAll('#header-row th').forEach(function(th){ th.classList.remove('drag-over'); th.style.opacity = ''; });
  if(!dragCol || dragCol === targetKey) return;
  var srcIdx = activeColumns.indexOf(dragCol);
  var tgtIdx = activeColumns.indexOf(targetKey);
  if(srcIdx < 0 || tgtIdx < 0) return;
  var srcCol = ALL_COLUMNS.find(function(c){ return c.key === dragCol; });
  var tgtCol = ALL_COLUMNS.find(function(c){ return c.key === targetKey; });
  if(srcCol && srcCol.fixed) return;
  if(tgtCol && tgtCol.fixed) return;
  activeColumns.splice(srcIdx, 1);
  var newTgt = activeColumns.indexOf(targetKey);
  activeColumns.splice(newTgt, 0, dragCol);
  dragCol = null;
  saveActiveColumns();
  renderTable();
}

function toggleColConfig(){

function renderColConfig(){
  var cont = document.getElementById('column-config-list');
  var groups = {};
  ALL_COLUMNS.forEach(function(c){
    if(c.fixed) return;
    if(!groups[c.group]) groups[c.group] = [];
    groups[c.group].push(c);
  });
  var gOrder = ['基础行情','策略评分','资金流向','基本面'];
  var html = '';
  gOrder.forEach(function(g){
    if(!groups[g]) return;
    html += '<div class="col-config-title">'+g+'</div>';
    var cols = groups[g];
    cols.sort(function(a,b){
      var ia=activeColumns.indexOf(a.key),ib=activeColumns.indexOf(b.key);
      if(ia<0)ia=999;if(ib<0)ib=999;
      return ia-ib;
    });
    cols.forEach(function(c){
      var chk=activeColumns.indexOf(c.key)>=0?'checked':'';
      var srcLabel={'avail':'✅ 可选','qmt':'⏳ 需QMT','dev':'🔧 需开发'}[c.source]||'';
      html += '<div class="col-config-item">'
        + '<input type="checkbox" class="cc-check" '+chk+' onchange="toggleCol(\''+c.key+'\',this.checked)">'
        + '<span class="cc-label">'+c.label+'</span>'
        + '<span class="cc-source '+c.source+'">'+srcLabel+'</span></div>';
    });
  });
  cont.innerHTML = html;
}
function toggleCol(key, show){
  if(show){if(activeColumns.indexOf(key)<0)activeColumns.push(key);}
  else{activeColumns=activeColumns.filter(function(k){return k!==key;});}
  saveActiveColumns();
  renderTable();
}

function resetColumnDefaults(){

  var def = ['check','code','name','price','change_pct','volume','composite','chanlun','vp','factor','fund_net','signal_tag'];
  activeColumns = def.slice();
  saveActiveColumns();
  renderColConfig();
  renderTable();
}

// ── 批量删除 ──
var _selectedForDelete = {};
var _watchlistIdByCode = {};
function toggleSelect(code, checked){
  if(checked) _selectedForDelete[code] = true;
  else delete _selectedForDelete[code];
  var btn = document.getElementById('delete-selected-btn');
  var cnt = Object.keys(_selectedForDelete).length;
  btn.disabled = cnt === 0;
  btn.textContent = cnt > 0 ? '🗑 删除 ('+cnt+')' : '🗑 删除';
}
async function deleteSelectedStocks(){
  var codes = Object.keys(_selectedForDelete);
  if(!codes.length) return;
  if(!confirm('确定从自选中移除以下 '+codes.length+' 只股票？\n\n'+codes.join('\n'))) return;
  var ok = 0, fail = 0;
  for(var i=0;i<codes.length;i++){
    var id = _watchlistIdByCode[codes[i]];
    if(!id){ fail++; continue; }
    try{
      await _apiFetch('/watchlist/'+id, {method:'DELETE'});
      ok++;
    }catch(e){ fail++; }
  }
  // 清除本地数据和选中状态
  codes.forEach(function(c){
    delete _selectedForDelete[c];
    stockData = stockData.filter(function(s){return s.code !== c;});
  });
  renderTable();
  document.getElementById('delete-selected-btn').disabled = true;
  document.getElementById('delete-selected-btn').textContent = '🗑 删除';
  if(fail === 0) alert('✅ 已移除 '+ok+' 只自选股');
  else alert('✅ 已移除 '+ok+' 只，'+fail+' 只移除失败');
}

  results.innerHTML = '';
  results.style.display = 'none';

var _searchTimer = null;
var _searchReqId = 0;  // 递增ID，用于忽略过期API响应
function searchStock(val){
  var el = document.getElementById('stock-search-results');
  var v = val.trim();
  // 输入为空 → 立即隐藏
  if(!v){ el.style.display = 'none'; el.innerHTML = ''; return; }
  clearTimeout(_searchTimer);
  var reqId = ++_searchReqId;
  _searchTimer = setTimeout(function(){
    var currentVal = (document.getElementById('stock-search-input').value || '').trim();
    if(currentVal !== v){ hideSearchResults(); return; }
    _apiFetch('/symbols/search', {params:{query:v, limit:10}})
      .then(function(res){
        if(reqId !== _searchReqId) return;  // 有更新的搜索请求，忽略
        var items = (res && res.data) || (res && res.stocks) || [];
        if(!items.length){ items = (res && res.results) || []; }
        if(!items.length){ el.innerHTML = '<div class="item" style="color:var(--text-muted);cursor:default;">未找到匹配的股票</div>'; el.style.display = 'block'; return; }
        var html = '';
        items.forEach(function(s){
          var code = s.ts_code || s.code || s.symbol || '';
          var name = s.name || '';
          html += '<div class="item" data-code="'+code.replace(/"/g,'&quot;')+'" data-name="'+name.replace(/"/g,'&quot;')+'">'+code+' '+name+'</div>';
        });
        el.innerHTML = html;
        el.style.display = 'block';
      })
      .catch(function(){
        if(reqId !== _searchReqId) return;
        el.innerHTML = '<div class="item" style="color:var(--text-muted);cursor:default;">搜索服务暂不可用</div>';
        el.style.display = 'block';
      });
  }, 300);
}

// ════════════════════════════════════════════
// 策略评估 — 对接 evaluate-batch API（单只走同一条后端链路）
// ════════════════════════════════════════════
function _saveEvalToCache(code, data){
  try{ sessionStorage.setItem('wl_eval_'+code, JSON.stringify(data)); }catch(e){}
}
function _loadEvalFromCache(code){
  try{
    var raw = sessionStorage.getItem('wl_eval_'+code);
    return raw ? JSON.parse(raw) : null;
  }catch(e){ return null; }
}
function _applyEvalToStock(s, r){
  if(!r) return;
  s.composite = r.composite_score;
  s.chanlun = r.chanlun_score;
  s.vp = r.volume_price_score;
  s.factor = r.factor_score;
  s.signal_tag = signalTagLabel(r.composite_score);
  s.buy_signal = r.buy_signal || '—';
  s.sell_signal = r.sell_signal || '—';
  s.tech_pattern = r.tech_pattern || '—';
  s.eval = true;
}

async function evaluateStock(code, btn){
  var s = stockData.find(function(x){return x.code===code;});
  if(!s)return;
  if(btn)btn.textContent='⏳ 评估中...';
  try{
    var resp=await _apiFetch('/screener/evaluate-batch', {
      method:'POST',
      body:{ts_codes:[code], strategies:['chanlun','volume_price','factor'], weights:{chanlun:0.4,volume_price:0.4,factor:0.2}}
    });
    if(resp && resp.success && resp.data){
      var r = resp.data.stocks && resp.data.stocks[code];
      if(r){ _applyEvalToStock(s, r); _saveEvalToCache(code, r); }
      else { fallbackEvaluate(s); }
    }else{fallbackEvaluate(s);}
  }catch(e){console.warn('策略评估失败',e);fallbackEvaluate(s);}
  s.eval=true;
  renderTable();
  if(btn)btn.textContent='⚡ 策略评估';
}
function fallbackEvaluate(s){
  s.composite='—'; s.chanlun='—'; s.vp='—'; s.factor='—';
  s.signal_tag='⚪ 中性';
}
function signalTagLabel(c){return c>=85?'🔥 强烈推荐':(c>=75?'✅ 推荐':(c>=60?'👀 关注':(c==='—'?'⚪ 待评估':'⚪ 中性')));}

// ════════════════════════════════════════════
// 全量策略刷新 — 批量评估（对接 evaluate-batch API）
// ════════════════════════════════════════════
async function refreshAllStrategies(){
  var codes = stockData.map(function(s){return s.code;});
  if(!codes.length) return;
  var msg = '将重新计算全部 '+codes.length+' 只自选股策略评分';
  if(!confirm('🔄 策略刷新\n\n'+msg+'\n\n继续？'))return;

  var btn=document.querySelector('.btn-primary');
  if(btn){btn.textContent='⏳ 批量评估中...';btn.disabled=true;}

  try{
    var resp = await _apiFetch('/screener/evaluate-batch', {
      method: 'POST',
      body: {
        ts_codes: codes,
        strategies: ['chanlun','volume_price','factor'],
        weights: {chanlun:0.4, volume_price:0.4, factor:0.2}
      }
    });
    if(resp && resp.success && resp.data){
      var stocks = resp.data.stocks || {};
      var evaluated = resp.data.evaluated || {};
      stockData.forEach(function(s){
        var r = stocks[s.code];
        if(r){
          _applyEvalToStock(s, r);
          _saveEvalToCache(s.code, r);
        }
      });
      renderTable();
      showToast('策略刷新完成 — '+Object.keys(evaluated).length+'/'+codes.length+' 只成功',3);
    } else {
      showToast('策略刷新失败: 接口返回异常',3);
    }
  }catch(e){
    console.warn('批量策略刷新失败', e);
    showToast('策略刷新失败: '+e.message,3);
  }
  if(btn){btn.textContent='🔄 策略刷新';btn.disabled=false;}
}
// ════════════════════════════════════════════
// Toast 提示
// ════════════════════════════════════════════
function showToast(msg, sec){
  var t=document.createElement('div');
  t.style.cssText='position:fixed;bottom:80px;left:50%;transform:translateX(-50%);background:#333;color:#fff;padding:10px 24px;border-radius:6px;z-index:99999;font-size:14px;white-space:nowrap;';
  t.textContent=msg;
  document.body.appendChild(t);
  setTimeout(function(){t.remove();},(sec||2)*1000);
}

// ════════════════════════════════════════════
// 筛选 & 排序
// ════════════════════════════════════════════
function getRatingKey(s){
  if(!s.eval) return 'pending';
  var c = s.composite || 0;
  return c>=85?'strong_buy':(c>=75?'buy':(c>=60?'watch':'neutral'));
}
function filterByRating(){
  var v = document.getElementById('filter-rating').value;
  document.querySelectorAll('#watchlist-table tbody tr').forEach(function(r){
    r.style.display = (v==='all' || r.getAttribute('data-rating')===v) ? '' : 'none';
  });
}
function updateCount(){
  document.getElementById('stock-count').textContent = '共 ' + stockData.length + ' 只';
}

// ════════════════════════════════════════════
// 初始化 — API优先
// ════════════════════════════════════════════
// ════════════════════════════════════════════
// WebSocket 实时行情推送
// ════════════════════════════════════════════
var _wsHost = API_BASE.replace('/api/v3', '');
var socket = typeof io !== 'undefined' ? io(_wsHost, {transports:['websocket','polling'], reconnectionDelay:5000}) : null;
var _wsDot = document.getElementById('ws-dot');
var _wsLabel = document.getElementById('ws-label');

function _subscribeWatchlist(){
  if(!socket || !socket.connected) return;
  var codes = stockData.map(function(s){ return s.code; });
  if(codes.length) socket.emit('subscribe_watchlist', {watchlist: codes});
}

if(socket){
  socket.on('connect', function(){
    _wsDot.className = 'status-dot green';
    _wsLabel.textContent = 'WebSocket 已连接';
    _subscribeWatchlist();
  });

  // 新增股票后重新订阅
  var _origAddStock = addStock;
  addStock = function(code, name){
    _origAddStock(code, name);
    _subscribeWatchlist();
  };

  // 数据加载完成后订阅（loadWatchlistData 是 async）
  var _origLoad = loadWatchlistData;
  loadWatchlistData = function(){
    return _origLoad().then(function(){ _subscribeWatchlist(); });
  };

  socket.on('disconnect', function(){
    _wsDot.className = 'status-dot';
    _wsDot.style.background = '#EF4444';
    _wsLabel.textContent = 'WebSocket 已断开';
  });

  socket.on('connect_error', function(){
    _wsDot.className = 'status-dot';
    _wsDot.style.background = '#F59E0B';
    _wsLabel.textContent = 'WebSocket 连接失败';
  });

  // 实时行情更新
  socket.on('stock:quotes', function(data){
    if(!data || !data.quotes || !data.quotes.length) return;
    data.quotes.forEach(function(q){
      var code = q.ts_code || q.code || '';
      if(!code) return;
      var s = stockData.find(function(x){ return x.code === code; });
      if(!s) return;
      if(q.price !== null && q.price !== undefined) s.price = (typeof q.price === 'number') ? q.price.toFixed(2) : q.price;
      if(q.change_pct !== null && q.change_pct !== undefined){
        var p = typeof q.change_pct === 'number' ? q.change_pct : parseFloat(q.change_pct) || 0;
        s.change = (p >= 0 ? '+' : '') + p.toFixed(2) + '%';
      }
      if(q.volume !== null && q.volume !== undefined) s.volume = fmtNum(q.volume);
      if(q.amount !== null && q.amount !== undefined) s.amount = fmtMoney(q.amount);
      if(q.open !== null && q.open !== undefined) s.open = (typeof q.open === 'number') ? q.open.toFixed(2) : q.open;
      if(q.high !== null && q.high !== undefined) s.high = (typeof q.high === 'number') ? q.high.toFixed(2) : q.high;
      if(q.low !== null && q.low !== undefined) s.low = (typeof q.low === 'number') ? q.low.toFixed(2) : q.low;
      // 昨收字段名：mootdx 用 prev_close，REST API 用 pre_close
      var pc = q.pre_close !== null && q.pre_close !== undefined ? q.pre_close : q.prev_close;
      if(pc !== null && pc !== undefined) s.pre_close = (typeof pc === 'number') ? pc.toFixed(2) : pc;
      if(s.high !== '—' && s.low !== '—' && s.pre_close !== '—'){
        var hi = parseFloat(s.high), lo = parseFloat(s.low), pc = parseFloat(s.pre_close);
        if(!isNaN(hi) && !isNaN(lo) && !isNaN(pc) && pc > 0){
          s.amplitude = ((hi - lo) / pc * 100).toFixed(2) + '%';
        }
      }
    });
    if(!window._renderThrottle){
      window._renderThrottle = setTimeout(function(){
        window._renderThrottle = null;
        renderTable();
      }, 3000);
    }
  });
} else {
  _wsDot.style.background = '#F59E0B';
  _wsLabel.textContent = 'SocketIO 不可用';
}

loadWatchlistData();

// ════════════════════════════════════════════
// 侧栏折叠（保持为最后一个脚本块）
// ════════════════════════════════════════════
var sidebarCollapsed = true;
function toggleSidebar(){
  sidebarCollapsed = !sidebarCollapsed;
  var s=document.querySelector('.sidebar'),m=document.querySelector('.main-content');
  if(!s||!m)return;
  s.classList.toggle('collapsed');m.classList.toggle('collapsed');
  m.style.marginLeft=(sidebarCollapsed?64:200)+'px';
  var btn=document.querySelector('.sidebar-toggle');
  if(btn)btn.textContent=sidebarCollapsed?'▶':'◀';
}
(function(){
  var s=document.querySelector('.sidebar'),m=document.querySelector('.main-content');
  if(s)s.classList.add('collapsed');
  if(m){m.classList.add('collapsed');m.style.marginLeft='64px';}
  var btn=document.querySelector('.sidebar-toggle');
  if(btn)btn.textContent='▶';
})();
</script>
